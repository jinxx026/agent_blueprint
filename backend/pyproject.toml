[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agentblueprint-backend"
version = "0.1.0"
description = "Backend API and runtime for AgentBlueprint"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "fastapi>=0.115,<1.0",
    "jsonschema>=4.23,<5.0",
    "langchain>=1.1,<2.0",
    "langchain-text-splitters>=1.0,<2.0",
    "langgraph>=1.0,<2.0",
    "pyjwt[crypto]>=2.10,<3.0",
    "pydantic-settings>=2.7,<3.0",
    "pypdf>=6.0,<7.0",
    "python-multipart>=0.0.20,<1.0",
    "pyyaml>=6.0,<7.0",
    "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1.0",
    "pytest>=8.3,<10.0",
    "ruff>=0.9,<1.0",
]
ui = [
    "httpx>=0.28,<1.0",
    "streamlit>=1.49,<2.0",
]
production = [
    "langgraph-checkpoint-postgres>=2.0,<4.0",
    "psycopg[binary,pool]>=3.2,<4.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
